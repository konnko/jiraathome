name: jiraathome
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
    volumes:
      - data:/data
volumes:
  data:
    name: jiraathome_data
